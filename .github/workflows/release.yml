name: Windows Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: |
          dotnet restore Snek.sln
          dotnet restore Snek/Snek.csproj --runtime win-x64

      - name: Build solution
        run: dotnet build Snek.sln --configuration Release --no-restore --nologo

      - name: Run tests
        run: dotnet run --project Snek.Tests/Snek.Tests.csproj --configuration Release --no-build -- -noLogo

      - name: Publish self-contained Windows application
        run: >-
          dotnet publish Snek/Snek.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/Snek-Studio-win-x64
          --nologo
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Create release package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/Snek-Studio-win-x64/* -DestinationPath artifacts/Snek-Studio-win-x64.zip
          $hash = (Get-FileHash artifacts/Snek-Studio-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Snek-Studio-win-x64.zip" | Set-Content artifacts/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          artifacts/Snek-Studio-win-x64.zip
          artifacts/SHA256SUMS.txt
          --title "Snek Studio $env:GITHUB_REF_NAME"
          --generate-notes
